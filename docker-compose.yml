version: "3.9"

services:

  # ---- PostgreSQL 15 with pgcrypto ---------------------------
  db:
    image: postgres:15-alpine
    container_name: bi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     bi_user
      POSTGRES_PASSWORD: StrongPass123
      POSTGRES_DB:       bi_system
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_user -d bi_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- FastAPI Backend ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bi_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # ---- React Frontend (dev) ----------------------------------
  frontend:
    image: node:20-alpine
    container_name: bi_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  pgdata:
